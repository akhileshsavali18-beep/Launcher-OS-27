name: Publish APK to Website Download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/*.apk Launcher-OS-27.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Launcher OS 27 Latest APK
          prerelease: true
          make_latest: false
          files: Launcher-OS-27.apk
          body: |
            Latest Launcher OS 27 APK generated by GitHub Actions.
            The website download button always points to the latest asset named Launcher-OS-27.apk.
