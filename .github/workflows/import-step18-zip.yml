name: Import Step 18 ZIP

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Step 18 ZIP
        id: zip
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP into repository
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          ZIP="${{ steps.zip.outputs.path }}"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          ROOT="$TMP"
          if [ "$(find "$TMP" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find "$TMP" -mindepth 1 -maxdepth 1 -type d)" ]; then
            ROOT="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d)"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$ROOT"/. .

          rm -f "$ZIP"
          rm -rf "$TMP"

      - name: Commit imported Step 18 source
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Launcher OS 27 Step 18 source" || exit 0
          git push
