name: Import Step 18 ZIP

on:
  push:
    paths:
      - "Launcher-OS-27-iOS27-Monetized-v18-Step18.zip"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Step 18 ZIP
        shell: bash
        run: |
          set -e
          test -f "Launcher-OS-27-iOS27-Monetized-v18-Step18.zip"

      - name: Extract ZIP into repository
        shell: bash
        run: |
          set -e
          ZIP="Launcher-OS-27-iOS27-Monetized-v18-Step18.zip"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          ROOT="$TMP"
          if [ "$(find "$TMP" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find "$TMP" -mindepth 1 -maxdepth 1 -type d)" ]; then
            ROOT="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d)"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$ROOT"/. .

          rm -f "$ZIP"
          rm -rf "$TMP"

      - name: Commit imported Step 18 source
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Launcher OS 27 Step 18 source" || exit 0
          git push
